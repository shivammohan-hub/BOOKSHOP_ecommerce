<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BookEshop</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>

body{
    background:#f8fafc;
}

form p{
    display:flex;
    flex-direction:column;
    gap:8px;
}

form label{
    font-weight:600;
    color:#334155;
    font-size:15px;
}

/* Input Fields */

form input[type=text],
form input[type=email],
form input[type=password],
form input[type=number],
form input[type=date],
form textarea,
form select{

    width:100%;
    padding:13px 16px;
    border:1px solid #cbd5e1;
    border-radius:12px;
    outline:none;
    background:white;
    font-size:15px;

}

form textarea{
    resize:vertical;
    min-height:100px;
}


/* Help Text */

.helptext{

    display:block;
    margin-top:8px;
    font-size:13px;
    color:#64748b;

}



</style>

</head>

<body class="bg-slate-50">

{% include "header.html" %}

<div class="min-h-[calc(100vh-80px)] flex items-center justify-center px-6 p-10">

    <div class="w-[35%]">

        <!-- Card -->

        <div class="bg-white rounded-xl border border-slate-200 shadow-lg overflow-hidden">

            <!-- Top -->

            <div class="px-10 py-6 text-center flex flex-col gap-3">

                <h1 class="text-4xl font-bold">
                    Create an account
                </h1>
                <p class="text-slate-600 text-center">
                    Join E<span class="text-rose-600">Book</span>Shop today to start your reading journey.
                </p>
            </div>

            <!-- Form -->

            <div class="px-10 py-5">

                

                <form action="" method="post" class="flex flex-col gap-5">
                    {% csrf_token %}

                    <p>
                        <label for="fname">First Name :</label>
                        <input type="text" name="fname" maxlength="150" autocapitalize="none" autocomplete="fname" autofocus="" required="" aria-describedby="fname" id="fname">
                    </p>

                    <p>
                        <label for="lname">Last Name :</label>
                        <input type="text" name="lname" maxlength="150" autocapitalize="none" autocomplete="lname" autofocus="" required="" aria-describedby="lname" id="lname">
                    </p>

                    <p>
                        <label for="email">Email id :</label>
                        <input type="email" name="email" maxlength="150" autocapitalize="none" autocomplete="email" autofocus="" required="" aria-describedby="email" id="email">
                    </p>

                    {{registerForm.as_p}}

                    <button
                        type="submit"
                        class="w-full bg-rose-600 hover:bg-rose-700 text-white py-3 rounded-xl font-semibold ">

                        Register User

                    </button>

                </form>

                <div class="py-8 text-center">

                    <p class="text-slate-500">

                        Don't have an account?

                        <a href=""
                           class="text-rose-600 hover:text-rose-700 font-semibold">

                            Register

                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
