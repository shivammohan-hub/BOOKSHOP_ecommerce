<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    

    {% include "admin/admin_header.html" %}


    <div class="w-full px-[10%] py-10 bg-slate-100  flex">
        
        <table class="border w-full">
            <thead>
                <tr>
                    <th class="border p-3">ID</th>
                    <th class="border p-3">Title</th>
                    <th class="border p-3">Description</th>
                    <th class="border p-3">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for g in genre %}
                <tr>
                    <td class="border p-3">{{g.id}}</td>
                    <td class="border p-3">{{g.title}}</td>
                    <td class="border p-3">{{g.description}}</td>
                    <td class="border flex gap-2">
                        <a href="{% url 'edit_genre' g.id %}" class="bg-sky-500 text-white px-2 py-1 text-sm rounded hover:bg-sky-700">Edit</a>
                        <a href="{% url 'delete_genre' g.id %}" class="bg-red-500 text-white px-3 py-2 rounded hover:bg-red-700">X</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    </div>

</body>
</html>
